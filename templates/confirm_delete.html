{% extends "base.html" %}

{% block title %}Confirm Delete - M & W Resources{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-lg border border-gray-200 shadow-sm p-6 mt-10">
  <h2 class="text-xl font-bold text-gray-900 mb-4 flex items-center">
    <span class="material-symbols-outlined text-red-500 mr-2">warning</span>
    Are you sure?
  </h2>
  <p class="text-gray-600 mb-6">
    This action cannot be undone. You are about to delete <strong class="text-gray-900">"{{ object }}"</strong>.
  </p>
  <form method="post" class="flex justify-end space-x-3">
    {% csrf_token %}
    <a href="{% if 'request' in request.path %}{% url 'core:request_list' %}{% else %}{% url 'core:record_list' %}{% endif %}" class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50 transition">
      Cancel
    </a>
    <button type="submit" class="bg-red-600 hover:bg-red-700 text-white px-5 py-2 rounded-md text-sm font-medium shadow-sm transition">
      Confirm Delete
    </button>
  </form>
</div>
{% endblock %}
